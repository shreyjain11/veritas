site_name: Veritas
site_description: >-
  Model-agnostic benchmark-integrity auditor for frontier-model evaluation
  claims, with a preserved biological leakage domain.

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

# Internal design docs live under docs/ but are not part of the published site.
exclude_docs: |
  PLAN.md
  SPEC.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences

nav:
  - Home: index.md
  - Benchmark integrity specification: BENCHMARK_INTEGRITY_SPEC.md
  - Open-weight models: open-weight-models.md
  - Scientific claims: SCIENTIFIC_CLAIMS.md
  - Threat model: THREAT_MODEL.md
  - V1 to V2 migration: migration-v1-to-v2.md
  - Usage: usage.md
  - Detectors: detectors.md
  - Validation: validation.md
  - Limitations & guarantees: limitations-and-guarantees.md
  - API: api.md
